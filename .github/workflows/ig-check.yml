name: Instagram token check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Instagram token and account access
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ["IG_ACCESS_TOKEN"]
          ig_user = os.environ["IG_USER_ID"]
          app_id = os.environ.get("IG_APP_ID") or "1125696607109973"
          base = "https://graph.facebook.com/v21.0"

          def call(path, params):
              url = base + path + "?" + urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      body = r.read().decode("utf-8", "ignore")
                      print(f"{path} -> HTTP {r.status}")
                      print(body[:800])
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "ignore")
                  print(f"{path} -> HTTP {e.code}")
                  print(body[:800])
              except Exception as e:
                  print(f"{path} -> ERROR {type(e).__name__}: {e}")

          call("/me", {"fields": "id,name", "access_token": token})
          call(f"/{ig_user}", {"fields": "id,username", "access_token": token})
          call(f"/{ig_user}", {"fields": "id,username", "access_token": token, "app_id": app_id})
          call(f"/{ig_user}/media", {"fields": "id,caption", "limit": "1", "access_token": token})
          PY
